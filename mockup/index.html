<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Driver App Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
/* Layout: mobile-first. On a phone the driver app fills the screen under a slim sticky bar (view + language).
   From 900px the driver app sits in a centered phone-width column with notes beside it. Fixed light theme by request. */
:root{
  --bg:#eef1ee; --surface:#ffffff; --sunk:#e3e8e4; --ink:#17211d; --muted:#5b6862; --line:#cfd8d2;
  --accent:#0f6b5c; --accent-ink:#ffffff; --signal:#9a6a00; --ok:#1f7a3e; --bad:#b3372b;
  color-scheme:light;
  --display:"Secular One","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:0;padding-block:0 32px}
button,input{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .name{font-family:var(--display);font-size:1.05rem;margin-inline-end:auto;white-space:nowrap}
@media (max-width:520px){.bar .name{display:none}.bar{justify-content:space-between}}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.9rem;min-height:36px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.demo{display:flex;gap:8px;align-items:center;padding:6px 16px;font-size:.85rem;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.demo input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.demo label{display:flex;gap:8px;align-items:center;cursor:pointer}

/* ---------- views ---------- */
.stage{display:flex;flex-direction:column;gap:16px}
.phone{background:var(--surface);display:flex;flex-direction:column;min-height:calc(100dvh - 110px);width:100%}
.notes{display:flex;flex-direction:column;gap:12px;padding-inline:16px}
@media (min-width:900px){
  .stage{flex-direction:row;justify-content:center;align-items:flex-start;gap:28px;padding:24px 16px 0}
  .phone{max-width:400px;min-height:720px;border:1px solid var(--line);border-radius:28px;overflow:hidden;flex:none}
  .notes{max-width:440px;padding:0}
}

/* ---------- driver app ---------- */
.ph-head{background:var(--accent);color:var(--accent-ink);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px}
.ph-head .t{font-family:var(--display);font-size:1.25rem;line-height:1.3}
.ph-head .m{opacity:.9;font-size:.9rem}
.ph-head a{color:inherit}
.prog{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent-ink);transition:width .3s}
.tally{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-bottom:1px solid var(--line)}
.tally div{display:flex;flex-direction:column;align-items:center;padding:8px 4px}
.tally b{font-variant-numeric:tabular-nums;font-size:1.05rem}
.tally span{font-size:.75rem;color:var(--muted)}
.ph-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.wiz{gap:14px}
.q{font-family:var(--display);font-size:1.25rem;text-align:center}
.counter{display:flex;align-items:center;justify-content:center;gap:24px}
.counter b{font-size:2.6rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.cbtn{font-size:1.8rem;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.bigfile{display:flex;flex-direction:column;gap:6px}
.bigfile input{position:absolute;opacity:0;width:1px;height:1px}
.bigbtn{display:block;text-align:center;font-weight:700;font-size:1.1rem;padding:20px;border:2px dashed var(--accent);border-radius:14px;color:var(--accent);cursor:pointer;background:var(--surface)}
.bigfile .small{align-self:center}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paybtn{font-weight:700;font-size:1.05rem;padding:16px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.paybtn small{font-weight:400;font-size:.72rem;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:8px}
.dots span{flex:1;font-size:.72rem;text-align:center;padding-top:6px;border-top:3px solid rgba(255,255,255,.3);opacity:.75}
.dots span.done{border-color:var(--accent-ink);opacity:.9}
.dots span.cur{border-color:var(--accent-ink);opacity:1;font-weight:700}
.wizfoot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.rule{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.rule.ok{border-color:var(--ok)}
.rule input{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.stop{display:grid;grid-template-columns:24px 30px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;cursor:pointer}
.stop .h{cursor:grab;color:var(--muted);font-size:1.2rem;text-align:center;user-select:none;touch-action:none}
.stop .n{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.stop.done{background:var(--sunk)}
.stop.done .n{background:var(--ok);color:#fff}
.stop.fail .n{background:var(--bad);color:#fff}
.stop .c{min-width:0}
.stop .c b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .c span{color:var(--muted);font-size:.88rem}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end}
.amt small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.ghost{opacity:.4}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:0}
.back{background:none;border:0;color:var(--accent-ink);cursor:pointer;padding:0;text-align:start;font-weight:600;align-self:flex-start;min-height:32px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.95rem;margin:0}
.info dt{color:var(--muted)} .info dd{margin:0}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.step-h{font-weight:700}
.step p{margin:0}
.step ul{margin:0;padding-inline-start:18px}
.big{font-size:1.15rem;font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
canvas.sig{width:100%;height:160px;background:var(--sunk);border-radius:8px;touch-action:none;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.approve{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
input[type=text],input[type=number],input[type=date]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:16px}
.warn{margin:0;color:var(--signal);font-weight:600}.warn:empty{display:none}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.btn{font-weight:700;border:0;border-radius:12px;padding:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%;min-height:52px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--bad);border:1px solid var(--line);font-weight:600}
.btn.sec2{background:var(--sunk);color:var(--ink);width:auto;padding-inline:20px}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.small{font-size:.9rem;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:6px 0}
.toast{background:var(--ok);color:#fff;border-radius:10px;padding:10px 12px;font-weight:600}
.paysum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.92rem}
.paysum .ok{color:var(--ok);font-weight:700} .paysum .warn{font-weight:700}
.pline{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pline.ok{border-color:var(--ok)}
.pl-h{display:flex;align-items:center;gap:10px}
.pl-h b{min-width:3.5em}
.pl-amt{display:flex;align-items:center;gap:4px;flex:1}
.pl-amt input{font-weight:700}
.pl-ph{display:flex;gap:10px;align-items:center}
.pl-ph img{width:64px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- notes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h2{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0}
.card ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}

/* ---------- office ---------- */
.office-wrap{display:flex;flex-direction:column;gap:14px;padding:16px}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
.office{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:900px){.office-wrap{max-width:1100px;margin:0 auto;padding-top:24px}.office{grid-template-columns:minmax(0,1fr) minmax(0,380px)}.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}}
.cards{display:flex;flex-direction:column;gap:8px;min-width:0}
.rcard{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.rcard.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
[dir=rtl] .rcard.sel{box-shadow:inset -3px 0 0 var(--accent)}
.rhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rhead .num{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);margin:0}
.rf{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:baseline;font-size:.92rem}
.rf .k{color:var(--muted);font-size:.82rem}
.paycell{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.stlink{font-weight:700;text-decoration:underline;color:var(--accent)}
.stlink.completed{color:var(--ok)} .stlink.failed{color:var(--bad)} .stlink.pending{color:var(--muted);font-weight:600}
.st{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block}
.st.pending{background:var(--sunk);color:var(--muted)} .st.completed{background:var(--ok);color:#fff} .st.failed{background:var(--bad);color:#fff} .st.partial{background:var(--signal);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.tile{padding:0;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center}
.tile img{width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.tile span{font-size:.78rem;color:var(--muted)}
.tile.empty{justify-content:flex-end}
.tile.empty::before{content:"";display:block;aspect-ratio:1;border-radius:10px;border:1px dashed var(--line)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;z-index:50;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;background:#fff}
.lnk{direction:ltr;font-size:.8rem;color:var(--accent);word-break:break-all;opacity:.75}
.empty{color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar">
  <span class="name" id="app-name"></span>
  <div class="seg" role="tablist">
    <button role="tab" id="tab-driver" aria-selected="true"></button>
    <button role="tab" id="tab-office" aria-selected="false"></button>
  </div>
  <div class="seg" aria-label="Language">
    <button id="lang-en" aria-pressed="false">EN</button>
    <button id="lang-he" aria-pressed="false">עב</button>
  </div>
</div>
<div class="demo"><label for="preview"><input type="checkbox" id="preview" checked><span id="demo-txt"></span></label></div>

<section id="view-driver" class="stage">
  <div class="phone" id="phone"></div>
  <aside class="notes">
    <div class="card">
      <h2 id="how-h"></h2>
      <ol id="how"></ol>
      <button class="small" id="reset-terms" style="align-self:flex-start"></button>
    </div>
  </aside>
</section>

<section id="view-office" hidden>
  <div class="office-wrap">
    <p class="explain" id="kpis"></p>
    <div class="office">
      <div id="rows" class="cards"></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
</section>

function linesOf(r){return r.lines||[]}
function paidSum(ls){return ls.reduce((a,l)=>a+(+l.amount||0),0)}
function tally(){const c=D.filter(d=>d.status==="completed");const Ls=c.flatMap(d=>linesOf(d).map(l=>({...l,cust:d.cust})));
  const cash=Ls.filter(l=>l.type==="cash").reduce((a,l)=>a+(+l.amount||0),0);
  const checks=Ls.filter(l=>l.type==="check").length, credit=Ls.filter(l=>l.type==="credit").length;
  const failed=D.filter(d=>d.status==="failed");
  const boxesBack=failed.reduce((a,d)=>a+d.boxes,0)+c.reduce((a,d)=>a+Math.max(0,d.boxes-(d.boxesDelivered??d.boxes)),0);
  const cashList=c.map(d=>({cust:d.cust,amt:linesOf(d).filter(l=>l.type==="cash").reduce((a,l)=>a+(+l.amount||0),0)})).filter(x=>x.amt>0);
  const returns=[...failed.map(d=>({cust:d.cust,n:d.boxes})),...c.filter(d=>d.boxesDelivered!=null&&d.boxesDelivered<d.boxes).map(d=>({cust:d.cust,n:d.boxes-d.boxesDelivered}))];
  const checkList=Ls.filter(l=>l.type==="check").map(l=>({cust:l.cust,num:l.checkNum||""}));
  return {checkList,cashList,returns,cash,checks,credit,delivered:c.length,partial:c.filter(d=>d.boxesDelivered!=null&&d.boxesDelivered!==d.boxes).length,failed:failed.length,open:D.filter(d=>d.status==="pending").length,boxesBack}}

    <div class="dots">${steps.map((s,i)=>`<span class="${i<draft.step?"done":i===draft.step?"cur":""}">${titles[s]}</span>`).join("")}</div></div>${tallyBar()}
    <div class="ph-body wiz">${preview?`<p class="hint">${t("demoHint")}</p>`:""}${body}</div>
    <div class="wizfoot">${draft.step>0?`<button class="btn sec2" id="prev">${t("prev")}</button>`:""}<button class="btn" id="next" ${stepOk(d,k)?"":"disabled"}>${last?t("finish"):t("next")}</button></div>`;
  const $=q=>phone.querySelector(q);
  $("#back").onclick=()=>{open=null;renderList()};
  if($("#prev"))$("#prev").onclick=()=>{draft.step--;renderStop()};
  $("#next").onclick=()=>{if(last)finish();else{draft.step++;renderStop();window.scrollTo(0,0)}};
  bindFile("f-photo","photos");bindFile("f-rma","rmaPhotos");
  phone.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{const kk=b.dataset.demo;draft[kk].push(ph(kk==="photos"?"phDelivery":"phReturn",kk==="photos"?160:0));renderStop()});
  if(k==="box"){$("#bx-minus").onclick=()=>{draft.boxes=Math.max(0,draft.boxes-1);renderStop()};$("#bx-plus").onclick=()=>{draft.boxes++;renderStop()};
    $("#fail").onclick=()=>{draft.failOpen=!draft.failOpen;renderStop()};
    phone.querySelectorAll("[data-reason]").forEach(b=>b.onclick=()=>{d.status="failed";d.closedAt=Date.now();d.time=now();d.reason=b.dataset.reason;d.seq=++doneCount;sel=d.id;open=null;renderList();renderOffice()});
    initSig();const sg=$("#signer");sg.oninput=()=>{draft.signer=sg.value;refreshNext()}}
  if(k==="pay"){
    phone.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const rem=Math.max(0,d.amount-paidSum(draft.lines));draft.lines.push({type:b.dataset.add,amount:rem,photo:null});renderStop()});
    phone.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{draft.lines.splice(+b.dataset.del,1);renderStop()});
    phone.querySelectorAll("[data-ocr]").forEach(b=>b.onclick=()=>{const l=draft.lines[+b.dataset.ocr];l.edit=!l.edit;renderStop()});
    phone.querySelectorAll("[data-ldemo]").forEach(b=>b.onclick=()=>{const l=draft.lines[+b.dataset.ldemo];l.photo=l.type==="check"?checkImg():ph("phCash",40);if(l.type==="check")readCheck(l);renderStop()});
    phone.querySelectorAll("input[data-lphoto]").forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const l=draft.lines[+inp.dataset.lphoto];l.photo=r.result;if(l.type==="check")readCheck(l);renderStop()};r.readAsDataURL(f)});
    phone.querySelectorAll("[data-l]").forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.l,l=draft.lines[i];l[inp.dataset.f]=inp.value;
      $("#paid-sum").textContent=fmt(paidSum(draft.lines));const r=$("#rem");r.textContent=remText(d);r.className=paidSum(draft.lines)===d.amount?"ok":"warn";
      const w=phone.querySelector(`#lw-${i}`);if(w)w.innerHTML=lineWarns(d,l,i);if(inp.dataset.f==="amount"){draft.diffReason=null;$("#diffbox").innerHTML=diffBox(d);bindDiff()}refreshNext()});
    const bindDiff=()=>phone.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{draft.diffReason=b.dataset.diff;$("#diffbox").innerHTML=diffBox(d);bindDiff();refreshNext()});bindDiff()}
}
function boxWarn(d){return draft.boxes===0?t("box0"):draft.boxes<d.boxes?t("boxShort",d.boxes-draft.boxes):draft.boxes>d.boxes?t("boxExtra",draft.boxes-d.boxes):""}
function refreshNext(){const d=byId(open);const k=wizSteps(d)[draft.step];phone.querySelector("#next").disabled=!stepOk(d,k)}
function diffBox(d){if(!draft.lines.length||paidSum(draft.lines)===d.amount)return "";const r=d.amount-paidSum(draft.lines);const opts=r>0?["later","discount","dispute"]:["debt","order"];
  return `<div class="pline"><b style="color:var(--signal)">${r>0?t("paysLess"):t("paysMore")}</b><div class="row">${opts.map(x=>`<button class="chip" data-diff="${x}" aria-pressed="${draft.diffReason===x}">${t("diffs")[x]}</button>`).join("")}</div></div>`}
function remText(d){const r=d.amount-paidSum(draft.lines);return r===0?t("full"):r>0?t("short",fmt(r)):t("over",fmt(-r))}
function lineOk(l){if(!(+l.amount>0))return false;if(l.type==="cash")return !!l.photo;if(l.type==="check")return !!l.photo&&["checkNum","bank","branch","account","dueDate"].every(k=>String(l[k]||"").trim());return true}
function payValid(d){if(!d.amount)return true;return draft.lines.length>0&&draft.lines.every(lineOk)&&(paidSum(draft.lines)===d.amount||!!draft.diffReason)}
function lineWarns(d,l,i){const w=[];
  if(l.type==="check"){if(l.drawerId&&d.taxId&&l.drawerId!==d.taxId)w.push(t("thirdParty"));
    if(l.dueDate&&d.checkDays){const days=Math.round((new Date(l.dueDate)-new Date("2026-09-30"))/864e5);if(days>d.checkDays)w.push(t("dueFar",days-d.checkDays,d.checkDays))}
    if(l.checkNum){const same=draft.lines.some((o,j)=>j!==i&&o.type==="check"&&o.checkNum===l.checkNum&&o.account===l.account);
      const other=D.find(x=>x.id!==d.id&&linesOf(x).some(o=>o.type==="check"&&o.checkNum===l.checkNum&&o.account===l.account));
      if(same)w.push(t("dupHere",l.checkNum));if(other)w.push(t("dupOther",l.checkNum,L(other.cust)))}}
  return w.map(x=>`<div>${x}</div>`).join("")}
function lineCard(d,l,i){const need=l.type!=="credit";
  const fields=[["checkNum","fCheckNum"],["bank","fBank"],["branch","fBranch"],["account","fAccount"],["drawerName","fDrawer"],["drawerId","fDrawerId"]];
  return `<div class="pline ${lineOk(l)?"ok":""}"><div class="pl-h"><b>${payLabel(l.type)}</b><label class="pl-amt">₪<input type="number" inputmode="decimal" data-l="${i}" data-f="amount" value="${l.amount}"></label><button class="small" data-del="${i}">${t("remove")}</button></div>
    ${need?(l.photo?`<div class="pl-ph"><img src="${l.photo}" alt=""><span class="sub">${l.type==="check"&&l.checkNum?`<span class="ltr">${l.checkNum} · ${l.bank}/${l.branch}/${l.account}</span><br>${l.drawerName} <button class="small" data-ocr="${i}">${t("fix")}</button>`:t("photographed")}</span></div>`
      :`<div class="bigfile"><label for="lp-${i}" class="bigbtn" style="padding:14px">${t("photoOf",payLabel(l.type))}</label><input id="lp-${i}" data-lphoto="${i}" type="file" accept="image/*" capture="environment"><button class="small" data-ldemo="${i}">${t("sample")}</button></div>`):""}
    ${l.type==="check"&&l.photo&&l.edit?`<div class="grid2">${fields.map(([k2,lb])=>`<label class="fld">${t(lb)}<input type="text" data-l="${i}" data-f="${k2}" value="${l[k2]||""}"></label>`).join("")}</div>`:""}
    ${l.type==="check"&&l.photo?`<label class="fld">${t("dueDate")}<input type="date" data-l="${i}" data-f="dueDate" value="${l.dueDate||""}"></label>`:""}
    <div class="warn" id="lw-${i}">${lineWarns(d,l,i)}</div></div>`}
/* Demo only: fills sample check values. The real reading is up to the developer. */
let scanN=0;
function readCheck(l){Object.assign(l,{checkNum:String(1000002+(scanN++)),bank:"10",branch:"647",account:"01234567",drawerName:"Israel Israeli",drawerId:"123456782"})}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function bindFile(id,key){const inp=phone.querySelector("#"+id);if(!inp)return;inp.onchange=()=>{[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{draft[key].push(r.result);renderStop()};r.readAsDataURL(f)})}}
function initSig(){const c=phone.querySelector("#sig");const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.5;x.lineCap="round";x.strokeStyle="#17211d";
  if(draft.sigData){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=draft.sigData}
  let down=false;const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
  c.onpointermove=e=>{if(!down)return;x.lineTo(...p(e));x.stroke()};
  c.onpointerup=()=>{if(!down)return;down=false;draft.sig=true;draft.sigData=c.toDataURL();refreshNext()};
  phone.querySelector("#clr").onclick=()=>{x.clearRect(0,0,c.width,c.height);draft.sig=false;draft.sigData=null;refreshNext()};
}
function now(){return new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function finish(){const d=byId(open);if(!d||d.status!=="pending")return;delete drafts[d.id];d.closedAt=Date.now();
  if(preview){if(d.amount&&!draft.lines.length)draft.lines.push({type:d.method,amount:d.amount,photo:null});draft.lines.forEach(l=>{if(l.type==="check"&&!l.checkNum){readCheck(l);l.dueDate=l.dueDate||"2026-11-06"}if(l.type!=="credit"&&!l.photo)l.photo=l.type==="check"?checkImg():ph("phCash",40)});if(!draft.signer.trim())draft.signer=L(d.contact);if(paidSum(draft.lines)!==d.amount&&!draft.diffReason)draft.diffReason="later"}
  d.status="completed";d.diffReason=draft.diffReason||null;d.seq=++doneCount;d.boxesDelivered=draft.boxes;d.time=now();d.lines=draft.lines.map(l=>({...l,amount:+l.amount}));
  d.res={photos:draft.photos,sig:draft.sigData||sigImg(),signer:draft.signer,rmaPhotos:draft.rmaPhotos};
  sel=d.id;open=null;renderList();renderOffice();window.scrollTo(0,0);
  const toast=document.createElement("div");toast.className="toast";toast.textContent=t("sent");phone.querySelector(".ph-body").prepend(toast);setTimeout(()=>toast.remove(),2600)}
function renderDone(d){const canUndo=d.closedAt&&Date.now()-d.closedAt<10*60*1000;
  phone.innerHTML=`<div class="ph-head"><button class="back" id="back">${t("back")}</button></div>
  <div class="ph-body">${pointHTML({...d,driver:driver.name})}${canUndo?`<button class="btn sec" id="undo">${t("undo")}</button>`:""}</div>`;
  phone.querySelector("#back").onclick=()=>{open=null;renderList()};
  if(canUndo)phone.querySelector("#undo").onclick=()=>{d.status="pending";delete d.res;delete d.lines;delete d.boxesDelivered;d.seq=null;d.closedAt=null;renderOffice();openStop(d.id)}}

/* ---------- main system: one "Delivery" column ---------- */
function allRows(){return [...order.map(id=>({...byId(id),driver:driver.name})),...others]}
function fmtDate(x){if(!x)return "";const [y,m,d]=x.split("-");return `${d}.${m}.${y}`}
function lineText(l){return l.type==="check"?`<b>${t("check")} ${l.checkNum||""}</b> · <span class="ltr">${l.bank}/${l.branch}/${l.account}</span> · ${fmtDate(l.dueDate)} · ${fmt(l.amount)}`:`<b>${payLabel(l.type)}</b> · ${fmt(l.amount)}`}
function statusText(r){return r.status==="completed"?t("stDone"):r.status==="failed"?t("stFailed"):t("stPending")}
function cellLink(r){return `<a class="stlink ${r.status}" href="#" data-open="${r.id}">${statusText(r)}</a>`}
function linkOf(id){return "deliver.example.com/s/"+id.slice(-6)+"x7Q"}
function renderOffice(){const rows=allRows();
  document.getElementById("kpis").textContent=t("officeExplain");
  document.getElementById("rows").innerHTML=rows.map(r=>{const ls=linesOf(r),paid=r.status==="completed"&&ls.length;
    return `<div class="rcard ${r.id===sel?"sel":""}" data-id="${r.id}" role="button" tabindex="0">
    <div class="rhead"><b class="num">${r.id}</b><span class="sub">${L(r.cust)}</span></div>
    <div class="rf"><span class="k">${t("colDelivery")}</span><span>${cellLink(r)}${paid?`<div class="paycell">${ls.map(l=>`<div>${lineText(l)}</div>`).join("")}${r.reviewed?`<span><span class="st completed">${t("entered")}</span></span>`:`<span class="row" style="margin-top:6px"><button class="chip approve" data-approve="${r.id}">${t("approve")}</button><span class="sub">${t("toReview")}</span></span>`}</div>`:""}</span></div></div>`}).join("");
  document.querySelectorAll("#rows .rcard").forEach(c=>c.onclick=e=>{e.preventDefault();const ap=e.target.closest("[data-approve]");
    if(ap){const id=ap.dataset.approve;const d=byId(id)||others.find(o=>o.id===id);d.reviewed=true;sel=id;renderOffice();return}
    sel=c.dataset.id;renderOffice();
    if(window.matchMedia("(max-width:899px)").matches)document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"start"})});
  renderPanel(rows.find(r=>r.id===sel));
}
function renderPanel(r){const p=document.getElementById("panel");if(!r){p.innerHTML=`<p class="empty">${t("pickRow")}</p>`;return}p.innerHTML=pointHTML(r)}
function pointHTML(r){
  const mine=D.includes(byId(r.id));const pos=mine?D.filter(d=>d.status==="pending").sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)).findIndex(d=>d.id===r.id):-1;
  const part=r.status==="completed"&&r.boxesDelivered!=null&&r.boxesDelivered!==r.boxes;
  const head=r.status==="completed"?`<span class="st ${part?"partial":"completed"}">${part?t("stPartial")+" · "+r.time:t("doneAt",r.time)}</span>`:r.status==="failed"?`<span class="st failed">${t("stFailed")} · ${t("reasons")[r.reason]||""}</span>`:(mine&&!accepted)?`<span class="st pending">${t("notYet")}</span>`:`<span class="st pending">${t("stPending")}${pos>=0?` · ${pos===0?t("next1"):pos===1?t("before1"):t("beforeN",pos)}`:""}</span>`;
  let body=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><h3>${L(r.cust)}</h3><div class="sub">${r.id} · ${L(r.driver)}</div></div>${head}</div>`;
  if(r.status==="completed"&&r.res){const ls=linesOf(r);
    const tile=(src,l,bg)=>src?`<button class="tile" data-full="${src}" aria-label="${l}"><img src="${src}" alt="" style="${bg||""}"><span>${l}</span></button>`:`<div class="tile empty"><span>${l}</span></div>`;
    body+=`<div class="tiles">${tile(r.res.photos[0],t("tDelivery"))}${tile(r.res.sig,t("tSignature"),"background:#fff;object-fit:contain")}${ls.filter(l=>l.photo).map(l=>tile(l.photo,payLabel(l.type))).join("")}${r.res.rmaPhotos.length?tile(r.res.rmaPhotos[0],t("tReturns",r.res.rmaPhotos.length)):`<div class="tile empty"><span>${t("noReturnsTile")}</span></div>`}</div>
    <dl class="info"><dt>${t("signedBy")}</dt><dd>${r.res.signer}</dd>${ls.length?`<dt>${t("payment")}</dt><dd><b>${fmt(paidSum(ls))}</b>${paidSum(ls)!==r.amount?` <span style="color:var(--signal)">(${t("ofTotal",fmt(r.amount))}${r.diffReason?" · "+t("diffs")[r.diffReason]:""})</span>`:""}</dd>`:""}
    ${ls.map(l=>`<dt>${payLabel(l.type)}</dt><dd>${l.type==="check"?`<span class="ltr">${l.checkNum} · ${l.bank}/${l.branch}/${l.account}</span> · ${fmtDate(l.dueDate)} · `:""}${fmt(l.amount)}${l.type==="check"&&l.drawerId&&r.taxId&&l.drawerId!==r.taxId?` <span style="color:var(--signal);font-weight:600">${t("thirdTag")}</span>`:""}</dd>`).join("")}</dl>`}
  else if(r.status==="completed") body+=`<p class="empty">${t("otherDriver")}</p>`;
  else if(r.status==="pending") body+=`<p class="empty">${t("willAppear")}</p>`;
  body+=`<div class="lnk">${linkOf(r.id)}</div>`;
  return body}
document.addEventListener("click",e=>{const tl=e.target.closest(".tile[data-full]");if(tl){const lb=document.createElement("div");lb.className="lightbox";lb.innerHTML=`<img src="${tl.dataset.full}" alt="">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb)}});

/* ---------- chrome: tabs, language, demo ---------- */
const tabs={driver:document.getElementById("tab-driver"),office:document.getElementById("tab-office")};
let view="driver";
function show(v){view=v;tabs.driver.setAttribute("aria-selected",v==="driver");tabs.office.setAttribute("aria-selected",v==="office");
  document.getElementById("view-driver").hidden=v!=="driver";document.getElementById("view-office").hidden=v!=="office";
  if(v==="office")renderOffice();else if(open&&byId(open).status==="pending")renderStop();}
function rerender(){if(open){const d=byId(open);if(d.status==="pending")renderStop();else renderDone(d)}else renderList();renderOffice()}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";
  document.getElementById("lang-en").setAttribute("aria-pressed",lang==="en");document.getElementById("lang-he").setAttribute("aria-pressed",lang==="he");
  document.getElementById("app-name").textContent=t("appName");tabs.driver.textContent=t("tabDriver");tabs.office.textContent=t("tabOffice");
  document.getElementById("demo-txt").textContent=t("demo");document.getElementById("how-h").textContent=t("howH");
  document.getElementById("how").innerHTML=t("how").map(x=>`<li>${x}</li>`).join("");document.getElementById("reset-terms").textContent=t("resetTerms");
  document.title=t("appName")}
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}applyLang();rerender()}
document.getElementById("lang-en").onclick=()=>setLang("en");document.getElementById("lang-he").onclick=()=>setLang("he");
tabs.driver.onclick=()=>show("driver");tabs.office.onclick=()=>show("office");
document.getElementById("preview").onchange=e=>{preview=e.target.checked;rerender()};
document.getElementById("reset-terms").onclick=()=>{accepted=null;checksOk=[false,false,false];open=null;show("driver");renderList();renderOffice();window.scrollTo(0,0)};
applyLang();
if(location.hash==="#office")show("office");
renderList();renderOffice();
})();
</script>
