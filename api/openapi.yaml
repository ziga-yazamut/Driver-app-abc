openapi: 3.1.0
info:
  title: Driver App ABC
  version: 0.1.0
  description: |
    Delivery app API. The main system already owns the delivery ID.
    Per delivery ID: one read in (the driver's deliveries) and one new column out, "Delivery":
      - the point link (written when the route is sent to the driver)
      - delivered / not delivered
      - the collected payment, marked "to review"
    The payment is written to the main system's existing payment rows only when staff click "Approve".
    Full plan (Hebrew): docs/plan.md
servers:
  - url: https://deliver.example.com

tags:
  - name: main-system
    description: שרת-לשרת, מהמערכת הראשית (API key)
  - name: driver-app
    description: מהטלפון של הנהג (טוקן מהקישור)
  - name: ocr

components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
    driverToken: { type: http, scheme: bearer }

  schemas:
    PaymentMethod:
      type: string
      enum: [cash, check, credit, prepaid]

    DeliveryIn:
      type: object
      required: [delivery_id, customer, address, boxes, payment]
      properties:
        delivery_id: { type: string, example: DLV-558812 }
        sequence: { type: integer, example: 1 }
        customer:
          type: object
          required: [name]
          properties:
            customer_id: { type: string }
            tax_id: { type: string, description: "ח.פ / ע.מ. משמש לזיהוי שיק צד ג'" }
            name: { type: string }
            contact_name: { type: string }
            phone: { type: string }
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            notes: { type: string }
            lat: { type: number }
            lng: { type: number }
        boxes: { type: integer, minimum: 0 }
        payment:
          type: object
          properties:
            amount_due: { type: number, example: 4250.0 }
            currency: { type: string, default: ILS }
            method: { $ref: "#/components/schemas/PaymentMethod" }
            check_terms_days: { type: integer, description: רק כש-method=check }
        notes: { type: string }

    RouteIn:
      type: object
      required: [route_id, date, driver, deliveries]
      properties:
        route_id: { type: string, example: R-2026-09-30-017 }
        date: { type: string, format: date }
        driver:
          type: object
          required: [driver_id, phone]
          properties:
            driver_id: { type: string }
            name: { type: string }
            phone: { type: string }
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/DeliveryIn" }

    RouteCreated:
      type: object
      properties:
        route_id: { type: string }
        driver_link: { type: string, format: uri }
        deliveries:
          type: array
          items:
            type: object
            properties:
              delivery_id: { type: string }
              point_url:
                type: string
                format: uri
                description: הקישור שנכתב לעמודת "מסירה" במערכת הראשית. זהה לנהג ולצוות, ונשאר זהה גם במשלוח חוזר.

    CheckDetails:
      type: object
      required: [check_number, bank, branch, account, due_date]
      properties:
        check_number: { type: string, pattern: "^[0-9]{5,10}$" }
        bank: { type: string, pattern: "^[0-9]{2}$" }
        branch: { type: string, pattern: "^[0-9]{3}$" }
        branch_field: { type: string, description: שדה הסניף המלא מה-MICR (5 ספרות) }
        account: { type: string, pattern: "^[0-9]{4,12}$" }
        due_date: { type: string, format: date, description: מוקלד ע"י הנהג }
        drawer_name: { type: string }
        drawer_id: { type: string }
        third_party: { type: boolean }
        ocr_needs_review: { type: boolean }
        ocr_reasons: { type: array, items: { type: string } }
        ocr_corrected_fields: { type: array, items: { type: string } }

    PaymentLine:
      type: object
      required: [line, method, amount, status]
      properties:
        line: { type: integer, minimum: 1, description: "מספר שורה. idempotency: delivery_id + revision + line" }
        method: { type: string, enum: [cash, check, credit] }
        amount: { type: number, exclusiveMinimum: 0 }
        photo_url: { type: string, format: uri, description: שיק ומזומן בלבד }
        check: { $ref: "#/components/schemas/CheckDetails" }
        status: { type: string, enum: [to_review, approved], default: to_review }
      allOf:
        - if: { properties: { method: { const: check } } }
          then: { required: [check, photo_url] }
        - if: { properties: { method: { const: cash } } }
          then: { required: [photo_url] }

    FileRef:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }

    DeliveryResult:
      type: object
      description: "Webhook: delivery.completed / delivery.failed. זה בדיוק מה שההדמיה שולחת (נבדק ב-mockup/tests)."
      required: [event, delivery_id, revision, route_id, driver_id, status, point_url]
      additionalProperties: false
      properties:
        event: { type: string, enum: [delivery.completed, delivery.failed] }
        delivery_id: { type: string }
        revision:
          type: integer
          minimum: 1
          description: עולה בכל סגירה (למשל אחרי "טעיתי, לפתוח מחדש"). המערכת הראשית מתעלמת מ-revision ישן.
        route_id: { type: string }
        driver_id: { type: string }
        status:
          type: string
          enum: [completed, partial, failed]
          description: "completed/partial = נמסר (partial = חסרו ארגזים), failed = לא נמסר"
        completed_at: { type: string, format: date-time }
        actual_sequence: { type: integer }
        boxes_expected: { type: integer }
        boxes_delivered: { type: integer }
        point_url: { type: string, format: uri }
        reason:
          type: string
          description: סיבת "לא נמסר" (חובה ב-failed)
        proof_of_delivery:
          type: object
          required: [photos, signature]
          properties:
            photos: { type: array, minItems: 1, items: { $ref: "#/components/schemas/FileRef" } }
            signature:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                signer_name: { type: string }
        amount_due: { type: number }
        amount_collected: { type: number }
        amount_diff_reason:
          type: string
          description: חובה כשהגבייה שונה מהסכום לגבייה ("ישלים בהמשך" / "הנחה מאושרת" / "מחלוקת")
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentLine" }
        rma:
          type: array
          items:
            type: object
            properties:
              photos: { type: array, items: { $ref: "#/components/schemas/FileRef" } }
      allOf:
        - if: { properties: { status: { const: failed } } }
          then: { required: [reason] }
          else: { required: [completed_at, proof_of_delivery, boxes_delivered] }

    RouteFinished:
      type: object
      description: "Webhook: route.finished, כשהנהג סוגר את היום"
      required: [event, route_id, driver_id, finished_at, totals]
      additionalProperties: false
      properties:
        event: { const: route.finished }
        route_id: { type: string }
        driver_id: { type: string }
        finished_at: { type: string, format: date-time }
        totals:
          type: object
          required: [checks_count, cash_total, credit_count, delivered, failed]
          properties:
            checks_count: { type: integer, description: מספר שיקים במעטפה (לא סכום) }
            cash_total: { type: number }
            credit_count: { type: integer }
            delivered: { type: integer }
            partial: { type: integer }
            failed: { type: integer }
            boxes_returned: { type: integer }
        actual_order: { type: array, items: { type: string } }

paths:
  /api/v1/routes:
    post:
      tags: [main-system]
      summary: יצירת מסלול לנהג ומסירותיו
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteIn" }
      responses:
        "201":
          description: נוצר. לכתוב את point_url לעמודת "מסירה" בכל delivery_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteCreated" }

  /api/v1/routes/{route_id}:
    parameters:
      - { name: route_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [main-system]
      summary: עדכון מסלול (הוספה או ביטול נקודה)
      security: [{ apiKey: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteIn" }
      responses: { "200": { description: עודכן } }
    get:
      tags: [main-system]
      summary: סטטוס מסלול
      security: [{ apiKey: [] }]
      responses: { "200": { description: OK } }

  /api/v1/deliveries/{delivery_id}:
    get:
      tags: [main-system]
      summary: התוצאה המלאה של נקודה (לדו"ח התאמה יומי, או אם webhook נכשל)
      security: [{ apiKey: [] }]
      parameters:
        - { name: delivery_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResult" }

  /app/route/accept:
    post:
      tags: [driver-app]
      summary: אישור נהלים במסך הפתיחה (חובה לפני הצגת הנקודות)
      security: [{ driverToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                terms_version: { type: string }
                accepted_at: { type: string, format: date-time }
      responses: { "204": { description: נשמר } }

  /app/route:
    get:
      tags: [driver-app]
      summary: כל הנקודות של הנהג
      security: [{ driverToken: [] }]
      responses: { "200": { description: OK } }

  /app/route/order:
    put:
      tags: [driver-app]
      summary: שמירת סדר אחרי גרירה
      security: [{ driverToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order: { type: array, items: { type: string } }
      responses: { "204": { description: נשמר } }

  /app/uploads:
    post:
      tags: [driver-app]
      summary: העלאת תמונה או חתימה (מוקטנת ל-~300KB בטלפון)
      security: [{ driverToken: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [delivery, signature, check, cash, rma] }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id: { type: string }
                  url: { type: string, format: uri }

  /app/deliveries/{delivery_id}/complete:
    post:
      tags: [driver-app]
      summary: סגירת נקודה. השרת שומר, מעדכן את הקישור ושולח webhook דרך תור עם ניסיונות חוזרים
      security: [{ driverToken: [] }]
      parameters:
        - { name: delivery_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryResult" }
      responses:
        "200": { description: נשמר }
        "409": { description: "כבר נסגרה (לחיצה כפולה). מחזיר את התוצאה הקיימת" }

  /app/deliveries/{delivery_id}/reopen:
    post:
      tags: [driver-app]
      summary: '"טעיתי, לפתוח מחדש" (עד 10 דקות מהסגירה)'
      security: [{ driverToken: [] }]
      parameters:
        - { name: delivery_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: נפתחה }
        "403": { description: עברו 10 דקות }

  /ocr/check:
    post:
      tags: [ocr]
      summary: קריאת שיק מצילום (ocr/api.py)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                customer_tax_id: { type: string }
                due_date: { type: string, format: date }
                check_terms_days: { type: integer }
      responses: { "200": { description: ראה ocr/README.md } }

webhooks:
  route.finished:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteFinished" }
      responses: { "200": { description: התקבל } }
  delivery.completed:
    post:
      summary: |
        נשלח ל-{main_system}/webhooks/delivery-completed בכל סגירה.
        חתימת HMAC בכותרת X-Signature. idempotency לפי delivery_id + revision.
        אחרי כתיבה: קריאה חוזרת לאימות. כשל אחרי כל הניסיונות: התראה למנהל.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryResult" }
      responses: { "200": { description: התקבל } }
