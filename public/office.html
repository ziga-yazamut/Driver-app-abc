<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABC Driver · Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/app.css">
<style>
body{padding:0;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h2{margin:0;font-size:1.05rem}
.lists{display:flex;flex-direction:column;gap:8px}
.li{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.li:hover{background:var(--sunk)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.btn.small2{width:auto;min-height:40px;padding:8px 16px}
.link{direction:ltr;word-break:break-all;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.9rem}
.mtable td .tiles{grid-template-columns:repeat(auto-fill,56px)}
.mtable td .tile img{width:56px;height:56px}
.form input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:16px;box-sizing:border-box}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.92rem}
</style>
<body>
<div class="bar"><span class="name">ABC Driver · <span id="h-office"></span></span><span style="flex:1"></span>
  <div class="seg" aria-label="Language"><button id="lang-en" aria-pressed="false">EN</button><button id="lang-he" aria-pressed="false">עב</button></div></div>
<div class="wrap" id="app"></div>
<script>
(function(){
/* The office page, view only: each driver's list (from the links drivers opened) and what came back:
   delivered or not, receiver, payments with check details, returns and every photo. Nothing is typed here. */
const S={
 office:{en:"Office",he:"משרד"},
 code:{en:"Office code",he:"קוד משרד"}, enter:{en:"Enter",he:"כניסה"}, wrong:{en:"Wrong code",he:"קוד שגוי"},
 notConfigured:{en:"ADMIN_CODE is not set in Netlify yet.",he:"עדיין לא הוגדר ADMIN_CODE ב-Netlify."},
 lists:{en:"Driver lists",he:"רשימות נהגים"}, none:{en:"No lists yet.",he:"אין עדיין רשימות."},
 count2:{en:"{0} delivered · {1} not delivered",he:"{0} נמסרו · {1} לא נמסרו"},
 back:{en:"‹ All lists",he:"→ כל הרשימות"},
 company:{en:"Customer",he:"לקוח"},
 total:{en:"To collect ₪",he:"לגבייה ₪"}, boxes:{en:"Boxes",he:"ארגזים"},
 status:{en:"Status",he:"סטטוס"}, payment:{en:"Payment",he:"תשלום"}, photos:{en:"Photos",he:"תמונות"},
 open:{en:"Open",he:"פתוחה"}, delivered:{en:"Delivered {0}",he:"נמסר {0}"}, partial:{en:"Partly delivered {0}",he:"נמסר חלקית {0}"}, failed:{en:"Not delivered",he:"לא נמסר"},
 receiver:{en:"Received by {0}",he:"קיבל: {0}"}, boxesOf:{en:"{0} of {1} boxes",he:"{0} מתוך {1} ארגזים"},
 check:{en:"Check",he:"שיק"}, cash:{en:"Cash",he:"מזומן"}, credit:{en:"Credit",he:"אשראי"}, rma:{en:"Returns",he:"חזרות"},
 accepted:{en:"Rules confirmed {0}",he:"אישר נהלים {0}"}, closed:{en:"Day closed {0}",he:"היום נסגר {0}"},
 mainOff:{en:"Not connected to the main system yet (MAIN_READ in Netlify).",he:"עדיין לא מחובר למערכת הראשית (MAIN_READ ב-Netlify)."},
 fromMain:{en:"What the drivers did, from their links. Reading the main system only: nothing is sent there.",he:"מה שהנהגים עשו, לפי הקישורים שלהם. קריאה בלבד מהמערכת הראשית: שום דבר לא נשלח לשם."},
 pick:{en:"This link has several drivers:",he:"בקישור הזה כמה נהגים:"},
 reasons:{en:{absent:"Customer not there",refused:"Customer refused",address:"Wrong address",damaged:"Damaged goods"},he:{absent:"הלקוח לא נמצא",refused:"הלקוח סירב",address:"כתובת שגויה",damaged:"סחורה פגומה"}},
 diffs:{en:{later:"Will pay the rest later",discount:"Approved discount",dispute:"Disputes the goods",debt:"Previous balance",order:"Order mistake"},he:{later:"ישלים בהמשך",discount:"הנחה מאושרת",dispute:"מחלוקת על הסחורה",debt:"יתרה קודמת",order:"טעות בהזמנה"}},
};
let lang;try{lang=localStorage.getItem("uiLang")}catch(e){}if(lang!=="en"&&lang!=="he")lang="he";
const t=(k,...a)=>{let s=S[k][lang];return typeof s==="string"?s.replace(/\{(\d)\}/g,(_,i)=>a[i]):s};
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fmt=n=>"₪"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const hhmm=iso=>iso?new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"";
const app=document.getElementById("app");
let code="";try{code=localStorage.getItem("officeCode")||""}catch(e){}
let view=null; // null = all lists, else a guid

async function api(path,body){
  const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,...body})}:{cache:"no-store"});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.message?`${j.error}: ${j.message}`:j.error||"error");e.status=r.status;throw e}return j}

function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";
  document.getElementById("lang-en").setAttribute("aria-pressed",lang==="en");document.getElementById("lang-he").setAttribute("aria-pressed",lang==="he");
  document.getElementById("h-office").textContent=t("office")}
document.getElementById("lang-en").onclick=()=>{lang="en";try{localStorage.setItem("uiLang",lang)}catch(e){}applyLang();render()};
document.getElementById("lang-he").onclick=()=>{lang="he";try{localStorage.setItem("uiLang",lang)}catch(e){}applyLang();render()};

function login(msg){
  app.innerHTML=`<div class="box" style="max-width:360px"><label class="fld">${t("code")}<input type="password" id="code" autocomplete="current-password"></label>${msg?`<p class="err" style="margin:0;color:var(--bad)">${msg}</p>`:""}<button class="btn" id="go">${t("enter")}</button></div>`;
  const go=()=>{code=app.querySelector("#code").value.trim();try{localStorage.setItem("officeCode",code)}catch(e){}render()};
  app.querySelector("#go").onclick=go;app.querySelector("#code").onkeydown=e=>{if(e.key==="Enter")go()}}

async function render(){
  if(!code){login();return}
  try{view?await renderList(view):await renderLists()}
  catch(e){if(e.status===403){code="";login(t("wrong"))}else if(e.status===503)app.innerHTML=`<div class="box">${t("notConfigured")}</div>`;else app.innerHTML=`<div class="box">${esc(e.message)}</div>`}}

async function renderLists(){
  const j=await api("/api/office?code="+encodeURIComponent(code));
  app.innerHTML=`<p class="note">${j.main?t("fromMain"):t("mainOff")}</p>
  <div class="box"><h2>${t("lists")}</h2><div class="lists">${j.lists.length?j.lists.map(l=>`<button class="li" data-g="${esc(l.guid)}"><span><b>${esc(l.person)}</b> · ${esc(l.list_date)}</span><span class="sub">${t("count2",l.delivered,l.failed)}</span></button>`).join(""):`<p class="sub">${t("none")}</p>`}</div></div>`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{view=b.dataset.g;render()});
}


function resultCell(tk,r){
  if(!r)return `<span class="st pending">${t("open")}</span>`;
  if(r.status==="not_delivered")return `<span class="st failed">${t("failed")}</span><div class="sub">${t("reasons")[r.reason]||""}</div>`;
  const part=r.boxes_delivered<tk.boxes;
  return `<span class="st ${part?"partial":"completed"}">${part?t("partial",hhmm(r.finished_at)):t("delivered",hhmm(r.finished_at))}</span><div class="sub">${t("receiver",esc(r.receiver_name))}</div>${part?`<div class="sub">${t("boxesOf",r.boxes_delivered,tk.boxes)}</div>`:""}`}
function payCell(tk,r){if(!r||r.status!=="delivered")return "";
  const ls=r.payments||[];
  return ls.map(l=>`<div><b>${t(l.type)}</b> ${fmt(l.amount)}${l.type==="check"?` · <span class="ltr">${esc(l.checkNum)} · ${esc(l.bank)}/${esc(l.branch)}/${esc(l.account)}</span> · ${esc(l.dueDate||"")}${l.holder?` · ${esc(l.holder)}`:""}`:""}</div>`).join("")+
    (Number(r.amount_paid)!==Number(tk.due)?`<div class="sub" style="color:var(--signal)">${fmt(r.amount_paid)} / ${fmt(tk.due)}${r.diff_reason?" · "+(t("diffs")[r.diff_reason]||esc(r.diff_reason)):""}</div>`:"")+
    (r.rma_note?`<div class="sub">${t("rma")}: ${esc(r.rma_note)}</div>`:"")}
function photoCell(r){if(!r||r.status!=="delivered")return "";
  const all=[...(r.package_urls||[]),...(r.receipt_urls||[]),r.signature_url,...(r.payments||[]).map(p=>p.photo_url),...(r.rma_urls||[])].filter(Boolean);
  return `<div class="tiles">${all.map(u=>`<a class="tile" href="${u}" target="_blank" rel="noopener"><img src="${u}" alt=""></a>`).join("")}</div>`}

async function renderList(g){
  const j=await api(`/api/office?code=${encodeURIComponent(code)}&guid=${g}`);
  if(j.master){app.innerHTML=`<button class="small" id="back" style="align-self:flex-start">${t("back")}</button><div class="box"><h2>${t("pick")}</h2><div class="lists">${j.people.map(p=>`<button class="li" data-g="${esc(p.guid)}"><b>${esc(p.person)}</b><span class="sub">${p.count}</span></button>`).join("")}</div></div>`;
    app.querySelector("#back").onclick=()=>{view=null;render()};app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{view=b.dataset.g;render()});return}
  app.innerHTML=`<button class="small" id="back" style="align-self:flex-start">${t("back")}</button>
  <div class="box"><h2>${esc(j.person)} · ${esc(j.date)}</h2>
    <div class="sub">${j.day&&j.day.accepted_at?t("accepted",hhmm(j.day.accepted_at)):""}${j.day&&j.day.closed_at?" · "+t("closed",hhmm(j.day.closed_at)):""}</div></div>
  <div class="box"><div class="cards" style="border:0"><table class="mtable"><thead><tr><th>${t("company")}</th><th>${t("total")}</th><th>${t("status")}</th><th>${t("payment")}</th><th>${t("photos")}</th></tr></thead><tbody>
    ${j.tasks.map(tk=>{const r=j.results[tk.id];return `<tr><td><b>${esc(tk.company)}</b><div class="sub">${esc([tk.address,tk.city].filter(Boolean).join(", "))}</div><div class="sub">${esc(tk.phone)} · ${tk.boxes} ${t("boxes")}</div></td><td class="num">${fmt(tk.due)}<div class="sub">${esc(tk.terms)}</div></td>
      <td>${resultCell(tk,r)}</td><td>${payCell(tk,r)}</td><td>${photoCell(r)}</td></tr>`}).join("")}
  </tbody></table></div></div>`;
  app.querySelector("#back").onclick=()=>{view=null;render()};
}
applyLang();render();
})();
</script>
