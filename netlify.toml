[build]
  publish = "public"
  functions = "netlify/functions"
  # Each deploy costs Netlify credits: skip it when nothing the live site uses changed
  # (tests, mockup, docs, ocr/ and the README don't need a deploy). Exit 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml package.json package-lock.json"

[functions]
  node_bundler = "esbuild"

# The driver's link: /d/<GUID> (the same GUID as the main system's driver link)
[[redirects]]
  from = "/d/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/office"
  to = "/office.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
