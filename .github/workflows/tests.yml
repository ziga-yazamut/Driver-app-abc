name: tests
on:
  push:
  pull_request:

jobs:
  ocr:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: pytest -q

  mockup-and-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openapi-spec-validator pyyaml
      - name: OpenAPI spec is valid
        run: python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi.yaml'))); print('valid')"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mockup
